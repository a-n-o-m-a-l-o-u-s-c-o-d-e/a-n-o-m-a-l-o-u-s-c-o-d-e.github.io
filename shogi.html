<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta
    name="description"
    content="Anomalous Code — secret."
>

<meta name="theme-color" content="#050505">

<title>SECRET — Anomalous Code</title>

<link
    rel="icon"
    type="image/svg+xml"
    href="assets/logo.svg"
>

<style>
    :root {
        --bg: #050505;
        --text: #f5f5f5;
        --muted: #888;
        --dim: #555;
        --border: #181818;
        --purple: #5100ff;
        --cyan: #00fff7;
    }

    * {
        box-sizing: border-box;
    }

    html {
        background: var(--bg);
    }

    body {
        margin: 0;
        min-height: 100vh;

        background: var(--bg);
        color: var(--text);

        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    /* =====================================================
       NAVBAR
       ===================================================== */

    .navbar {
        position: sticky;
        top: 0;
        z-index: 100;

        width: 100%;

        border-bottom:
            1px solid
            rgba(255, 255, 255, 0.06);

        background:
            rgba(5, 5, 5, 0.88);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    .nav-inner {
        width: min(1200px, calc(100% - 48px));

        min-height: 72px;

        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .nav-brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;

        color: var(--text);

        text-decoration: none;

        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .nav-brand img {
        width: 28px;
        height: 28px;

        display: block;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
    }

    .nav-links a {
        color: #777;

        text-decoration: none;

        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        transition:
            color 160ms ease;
    }

    .nav-links a:hover {
        color: var(--text);
    }

    /* =====================================================
       CONTENT
       ===================================================== */

    main {
        width: 100%;
        max-width: 760px;

        margin: 0 auto;

        padding: 64px 24px 72px;
    }

    .secret-header {
        margin-bottom: 28px;
    }

    .secret-label {
        margin-bottom: 10px;

        color: var(--cyan);

        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.18em;
    }

    h1 {
        margin: 0;

        font-size: clamp(3rem, 8vw, 5.5rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        font-weight: 900;
    }

    h1 .crossed {
        color: transparent;

        -webkit-text-stroke:
            1px rgba(255, 255, 255, 0.3);

        text-decoration:
            line-through
            var(--purple);

        text-decoration-thickness: 3px;
    }

    h1 .secret {
        color: var(--text);
    }

    .description {
        margin: 18px 0 0;

        color: var(--muted);

        font-size: 0.9rem;
        line-height: 1.5;
    }

    /* =====================================================
       VIDEO
       ===================================================== */

    .video {
        width: 100%;
        max-width: 560px;

        aspect-ratio: 16 / 9;

        margin: 0 auto;

        overflow: hidden;

        border:
            1px solid
            rgba(255, 255, 255, 0.12);

        background: #000;

        box-shadow:
            0 0 0 1px
                rgba(81, 0, 255, 0.08),
            0 20px 60px
                rgba(0, 0, 0, 0.5);
    }

    iframe {
        display: block;

        width: 100%;
        height: 100%;

        border: 0;
    }

    /* =====================================================
       BACK BUTTON
       ===================================================== */

    .back {
        display: flex;
        justify-content: center;

        margin-top: 28px;
    }

    .back a {
        display: inline-flex;
        align-items: center;
        gap: 12px;

        min-height: 42px;

        padding: 0 18px;

        border:
            1px solid
            rgba(255, 255, 255, 0.12);

        color: var(--text);

        text-decoration: none;

        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        transition:
            border-color 160ms ease,
            background 160ms ease;
    }

    .back a:hover {
        border-color:
            rgba(81, 0, 255, 0.65);

        background:
            rgba(81, 0, 255, 0.08);
    }

    .back-arrow {
        color: var(--cyan);
        font-size: 1rem;
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    .secret-footer {
        width: 100%;
        max-width: 560px;

        margin: 12px auto 0;

        display: flex;
        justify-content: space-between;

        color: var(--dim);

        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.14em;
    }

    @media (max-width: 700px) {
        .nav-inner {
            width: calc(100% - 36px);
        }

        .nav-links {
            gap: 14px;
        }

        main {
            padding-top: 48px;
        }
    }

    @media (max-width: 520px) {
        .nav-brand span {
            display: none;
        }

        .nav-links {
            gap: 12px;
        }

        .nav-links a {
            font-size: 0.6rem;
        }

        main {
            padding-left: 18px;
            padding-right: 18px;
        }

        .video {
            max-width: 100%;
        }

        .secret-footer {
            max-width: 100%;
            flex-direction: column;
            gap: 6px;
        }
    }
</style>


</head>

<body>


<nav class="navbar">
    <div class="nav-inner">

        <a
            class="nav-brand"
            href="index.html"
            aria-label="Anomalous Code home"
        >
            <img src="assets/logo.svg" alt="">
            <span>ANOMALOUS CODE</span>
        </a>

        <div class="nav-links">
            <a href="projects.html">Projects</a>
            <a href="lab.html">Lab</a>
            <a href="about.html">About</a>
        </div>

    </div>
</nav>

<main>

    <header class="secret-header">

        <div class="secret-label">
            ANOMALY DETECTED
        </div>

        <h1>
            <span class="crossed">404</span>
            <span class="secret">SECRET.</span>
        </h1>

        <p class="description">
            You found something you shouldn't.
        </p>

    </header>

    <section class="video">
        <iframe
            src="https://www.youtube.com/embed/dB8QCac8FSM?autoplay=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3"
            title="Shogi Ichiban"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
        ></iframe>
    </section>

    <div class="back">
        <a href="index.html">
            <span class="back-arrow">←</span>
            Go back
        </a>
    </div>

    <footer class="secret-footer">
        <span>INCIDENT-???</span>
        <span>STATUS: DO NOT REPORT</span>
    </footer>

</main>


</body>
</html>
